<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | ReWear</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: { extend: { colors: { brand: { light: '#dcfce7', DEFAULT: '#16a34a', dark: '#15803d' } } } }
      }
    </script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

    <nav class="bg-white shadow-sm py-4 px-6 text-center">
        <a href="/" class="text-2xl font-bold text-brand tracking-tight">♻️ ReWear</a>
    </nav>

    <div class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full border border-gray-100">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Create an Account</h2>
            
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="bg-blue-50 text-blue-700 px-4 py-3 rounded-lg mb-6 text-sm">
                {% for message in messages %}
                  <p>• {{ message }}</p>
                {% endfor %}
                </div>
              {% endif %}
            {% endwith %}

            <form method="POST" action="/register" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text" name="username" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" name="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" name="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none transition">
                </div>
                
                <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 mt-6">
                    <p class="text-xs text-gray-500 mb-3">We need your location to match you with nearby exchanges.</p>
                    <div class="flex gap-2 mb-3">
                        <input type="text" name="latitude" id="lat" placeholder="Latitude" readonly required class="w-1/2 px-3 py-2 bg-gray-100 border border-gray-300 rounded-lg text-sm text-gray-500 outline-none">
                        <input type="text" name="longitude" id="lng" placeholder="Longitude" readonly required class="w-1/2 px-3 py-2 bg-gray-100 border border-gray-300 rounded-lg text-sm text-gray-500 outline-none">
                    </div>
                    <button type="button" onclick="getLocation()" class="w-full bg-white border border-gray-300 text-gray-700 py-2 rounded-lg text-sm font-medium hover:bg-gray-50 transition shadow-sm flex items-center justify-center gap-2">
                        <span>📍</span> Auto-Detect Location
                    </button>
                </div>
                
                <button type="submit" class="w-full bg-brand hover:bg-brand-dark text-white font-bold py-3 px-4 rounded-lg transition shadow-md mt-4">
                    Sign Up
                </button>
            </form>

            <p class="mt-6 text-center text-sm text-gray-600">
                Already have an account? <a href="/login" class="text-brand font-medium hover:underline">Log in</a>
            </p>
        </div>
    </div>

    <script>
    function getLocation() {
        const btn = document.querySelector('button[onclick="getLocation()"]');
        btn.innerHTML = 'Detecting...';
        
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                document.getElementById('lat').value = position.coords.latitude;
                document.getElementById('lng').value = position.coords.longitude;
                btn.innerHTML = '✅ Location Saved';
                btn.classList.add('bg-green-50', 'text-green-700', 'border-green-200');
            }, function(error) {
                alert("Please allow location access to continue.");
                btn.innerHTML = '📍 Try Again';
            });
        } else {
            alert("Geolocation is not supported by your browser.");
        }
    }
    </script>
</body>
</html>
